name: Cleaner
options:
  bundleIdPrefix: com.aichera
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Cleaner:
    path: ..
  # Otomatik güncelleme. Kararlı sürüme sabit (exact); güncelleme bilinçli yapılır.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Cleaner:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: Cleaner
        product: CleanerAppCore
      - package: Cleaner
        product: CleanerKit
      - package: Sparkle
        product: Sparkle
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Hepp Cleaner
        CFBundleDisplayName: Hepp Cleaner
        # Sürüm tek yerde: aşağıdaki MARKETING_VERSION / CURRENT_PROJECT_VERSION.
        # Sparkle sürümleri CFBundleVersion (artan tam sayı) ile karşılaştırır; her yayında 1 artırın.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Aichera"
        # Sparkle 2 (docs/DAGITIM.md). karar: günde bir denetle, kurmadan önce sor.
        SUFeedURL: "$(SPARKLE_FEED_URL)"
        SUPublicEDKey: "PChQCaDgrXoOqxJC7xlXnwDacJ9YkCo9vpIeSGYLeQk="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        NSAppleEventsUsageDescription: "Hepp Cleaner, korunan uygulamaları Finder ile Çöp Kutusu'na taşımak için Finder'ı kullanır; macOS parola ya da Touch ID isteyebilir."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aichera.cleaner
        PRODUCT_NAME: Hepp Cleaner
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "2"
        # Yalnız yerel güncelleme denemesi için build-app.sh FEED_URL=... ile ezilebilir.
        SPARKLE_FEED_URL: "https://github.com/aichera-ant/cleaner/releases/latest/download/appcast.xml"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
